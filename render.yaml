services:
  - type: web
    name: adab-opportunityfinder
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
